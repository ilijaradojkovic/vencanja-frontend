name: uspomena-observability

# Local-only Prometheus + Grafana stack (LOCAL_DEVELOPMENT.md §6).
# Started by `npm run dev:bootstrap` / `dev:services`, stopped by `dev:teardown`.
# The API runs on the host (`npm run dev`), so Prometheus scrapes
# host.docker.internal:3000 and reads its bearer token from the ignored
# `metrics-token` file written by bootstrap.

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - '3001:3000'
    environment:
      # Local disposable credentials (not for any hosted environment).
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/http.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

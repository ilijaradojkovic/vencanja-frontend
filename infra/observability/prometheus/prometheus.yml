global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: uspomena-api
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      # Written by `npm run dev:bootstrap` next to this stack; git-ignored.
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['host.docker.internal:3000']
